<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Stats</title>
<style>
/* Layout: a live strip on top, a product list on the left, one product's meters on the right. */
:root {
  --bg: #eef1ee; --panel: #fbfcfa; --line: #d3dad4; --ink: #17302b; --muted: #5b6e68;
  --new: #0f766e; --reread: #a8660c; --track: #e3e8e3; --live: #15803d; --select: #dcebe6;
  --sans: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101a18; --panel: #17231f; --line: #2b3b36; --ink: #e6eeea; --muted: #9db0a9;
    --new: #3dbdaf; --reread: #e5a44a; --track: #24332e; --live: #4ade80; --select: #213530; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101a18; --panel: #17231f; --line: #2b3b36; --ink: #e6eeea; --muted: #9db0a9;
  --new: #3dbdaf; --reread: #e5a44a; --track: #24332e; --live: #4ade80; --select: #213530; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--sans); }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; }
h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
h2 { font-size: 26px; margin: 0; letter-spacing: -.015em; overflow-wrap: anywhere; text-wrap: balance; }
h3 { font-size: 12px; margin: 0 0 10px; color: var(--muted); font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
.status { display: inline-flex; gap: 7px; align-items: center; color: var(--muted); font: 12.5px var(--mono); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--live); }
.dot.off { background: var(--muted); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 18px; }
.now { display: grid; gap: 12px; }
.now-head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.now-head strong { font-size: 19px; overflow-wrap: anywhere; }
.now-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; }
.main { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 20px; align-items: start; }
.list { display: grid; gap: 2px; padding: 8px; }
.item { all: unset; box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 10px; border-radius: 6px; cursor: pointer; }
.item:hover { background: var(--track); }
.item[aria-current="true"] { background: var(--select); }
.item:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--new); outline-offset: 1px; }
.item b { font-weight: 600; overflow-wrap: anywhere; }
.item span { color: var(--muted); font: 12px var(--mono); }
.item .right { text-align: right; }
.detail { display: grid; gap: 20px; min-width: 0; }
.title { display: grid; gap: 12px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button, select, input { font: inherit; font-size: 13px; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
select { max-width: 100%; }
button { cursor: pointer; }
button:hover { background: var(--track); }
input { min-width: 0; }
.meters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.meter { background: var(--panel); padding: 14px 16px; min-width: 0; }
.label { display: block; color: var(--muted); font-size: 12.5px; }
.value { display: block; font: 600 28px/1.2 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.03em; overflow-wrap: anywhere; }
.now-strip .value { font-size: 20px; }
.tokens { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.token { padding: 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); min-width: 0; }
.token .value { font-size: 34px; }
.token.new .value { color: var(--new); }
.token.reread .value { color: var(--reread); }
.per { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; justify-content: space-between; padding: 14px 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.per .value { font-size: 22px; }
.chart { display: grid; gap: 14px; }
.series-head { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
.series-head b { font-weight: 600; }
.series-head b.new { color: var(--new); } .series-head b.reread { color: var(--reread); }
.bars { display: flex; align-items: flex-end; gap: 2px; height: 72px; border-bottom: 1px solid var(--line); }
.bar { flex: 1 1 0; min-width: 2px; border-radius: 2px 2px 0 0; }
.bar.new { background: var(--new); } .bar.reread { background: var(--reread); }
.axis { display: flex; justify-content: space-between; color: var(--muted); font: 12px var(--mono); }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: right; color: var(--muted); font-weight: 500; font-size: 12.5px; padding: 0 0 8px 14px; white-space: nowrap; }
td { text-align: right; padding: 8px 0 8px 14px; border-top: 1px solid var(--line); font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; padding-left: 0; }
.empty { color: var(--muted); }
.hidden-list { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; }
@media (max-width: 820px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .meters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 460px) {
  .tokens { grid-template-columns: minmax(0, 1fr); }
  .token .value { font-size: 30px; }
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const REFRESH_MS = 5000;
const UNSORTED = '__unsorted__';
const appEl = document.getElementById('app');
let data = null, failed = false, selected = null, renaming = false, lastJson = '';

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props ?? {})) {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v !== undefined) el.setAttribute(k, v);
  }
  el.append(...kids.flat().filter((c) => c !== null && c !== undefined));
  return el;
}
const compact = (n) => {
  if (n >= 1e9) return `${(n / 1e9).toFixed(2)}B`;
  if (n >= 1e6) return `${(n / 1e6).toFixed(1)}M`;
  if (n >= 1e3) return `${(n / 1e3).toFixed(1)}K`;
  return String(Math.round(n));
};
const full = (n) => Math.round(n).toLocaleString('en-US');
const hours = (n) => (n < 10 ? n.toFixed(1) : String(Math.round(n)));
const shortDate = (d) => new Date(`${d}T12:00:00`).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });

async function send(body) {
  await fetch('/api/override', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  renaming = false;
  lastJson = '';
  await load();
}

function meter(label, value, title) {
  return h('div', { class: 'meter' }, h('span', { class: 'label' }, label), h('span', { class: 'value', title }, value));
}
function statusLine() {
  if (failed) return h('span', { class: 'status' }, h('span', { class: 'dot off' }), 'Not connected. Run the command again.');
  if (data?.syncing) return h('span', { class: 'status' }, h('span', { class: 'dot off' }), 'Reading your logs');
  const time = data ? new Date(data.generatedAt).toLocaleTimeString() : '';
  return h('span', { class: 'status' }, h('span', { class: 'dot' }), `Live. Updated ${time}`);
}
function nowPanel() {
  const p = data.current;
  if (!p) return h('section', { class: 'panel now' }, h('h3', null, 'Working on now'), h('span', { class: 'empty' }, 'No session is running now.'));
  return h('section', { class: 'panel now' },
    h('div', { class: 'now-head' }, h('h3', { style: 'margin:0' }, 'Working on now'), h('strong', null, p.name)),
    h('div', { class: 'now-strip' },
      nowMeter('Days', p.days), nowMeter('Estimated hours', hours(p.hours)), nowMeter('Agents', p.agents),
      nowMeter('Subagents', p.subagents), nowMeter('New tokens', compact(p.newTokens), full(p.newTokens)),
      nowMeter('Re-read tokens', compact(p.rereadTokens), full(p.rereadTokens))));
}
function nowMeter(label, value, title) {
  return h('div', null, h('span', { class: 'label' }, label), h('span', { class: 'value', title }, String(value)));
}
function allItems() {
  return [...data.products, ...(data.unsorted ? [data.unsorted] : [])];
}
function listPanel() {
  const items = allItems().map((p) => h('button', {
    class: 'item', 'aria-current': String(p.id === selected),
    onclick: () => { selected = p.id; renaming = false; draw(); },
  }, h('b', null, p.name), h('span', { class: 'right' }, `${compact(p.newTokens)}`),
    h('span', null, `${p.days} ${p.days === 1 ? 'day' : 'days'}`), h('span', { class: 'right' }, `${p.agents} ${p.agents === 1 ? 'agent' : 'agents'}`)));
  return h('nav', { class: 'panel list', 'aria-label': 'Products' }, items);
}
function actions(p) {
  if (p.id === UNSORTED) return null;
  if (renaming) {
    const input = h('input', { id: 'rename-input', value: p.name, 'aria-label': 'Product name' });
    const form = h('form', { class: 'actions', onsubmit: (e) => {
      e.preventDefault();
      if (input.value.trim()) send({ action: 'rename', id: p.id, name: input.value.trim() });
    } }, input, h('button', { type: 'submit' }, 'Save'), h('button', { type: 'button', onclick: () => { renaming = false; draw(); } }, 'Cancel'));
    setTimeout(() => input.focus());
    return form;
  }
  const others = data.products.filter((o) => o.id !== p.id);
  const join = others.length ? h('select', { id: 'join-select', 'aria-label': 'Join this product with another product', onchange: (e) => {
    if (e.target.value) send({ action: 'merge', from: e.target.value, to: p.id }).then(() => draw());
  } }, h('option', { value: '' }, 'Join with'), others.map((o) => h('option', { value: o.id }, o.name))) : null;
  return h('div', { class: 'actions' },
    h('button', { onclick: () => { renaming = true; draw(); } }, 'Rename'), join,
    h('button', { onclick: () => { selected = null; send({ action: 'hide', id: p.id }); } }, 'Hide'));
}
function series(label, kind, days) {
  const top = Math.max(...days.map((d) => d[kind === 'new' ? 'newTokens' : 'rereadTokens']), 1);
  return h('div', null,
    h('div', { class: 'series-head' }, h('b', { class: kind }, label), h('span', null, `Highest ${compact(top)}`)),
    h('div', { class: 'bars', style: `max-width:${days.length * 36}px` }, days.map((d) => {
      const v = d[kind === 'new' ? 'newTokens' : 'rereadTokens'];
      return h('div', { class: `bar ${kind}`, style: `height:${Math.max((v / top) * 100, v ? 2 : 0)}%`, title: `${shortDate(d.date)}: ${full(v)}` });
    })));
}
function dayChart(p) {
  if (!p.perDay.length) return null;
  return h('section', { class: 'panel' }, h('h3', null, 'Tokens per worked day'), h('div', { class: 'chart' },
    series('New tokens', 'new', p.perDay), series('Re-read tokens', 'reread', p.perDay),
    h('div', { class: 'axis', style: `max-width:${Math.max(p.perDay.length * 36, 120)}px` }, h('span', null, shortDate(p.perDay[0].date)), p.perDay.length > 1 ? h('span', null, shortDate(p.perDay.at(-1).date)) : null)));
}
function modelTable(p) {
  if (!p.perModel.length) return null;
  return h('section', { class: 'panel' }, h('h3', null, 'Tokens per AI model'), h('div', { class: 'scroll' }, h('table', null,
    h('thead', null, h('tr', null, h('th', null, 'Model'), h('th', null, 'New'), h('th', null, 'Re-read'))),
    h('tbody', null, p.perModel.map((m) => h('tr', null, h('td', null, m.model), h('td', { title: full(m.newTokens) }, compact(m.newTokens)), h('td', { title: full(m.rereadTokens) }, compact(m.rereadTokens))))))));
}
function sessionTable(p) {
  if (!p.topSessions.length) return null;
  const assign = p.id === UNSORTED && data.products.length;
  return h('section', { class: 'panel' }, h('h3', null, 'Top five sessions'), h('div', { class: 'scroll' }, h('table', null,
    h('thead', null, h('tr', null, h('th', null, 'Date'), h('th', null, 'New'), h('th', null, 'Re-read'), h('th', null, 'Requests'), assign ? h('th', null, 'Product') : null)),
    h('tbody', null, p.topSessions.map((s) => h('tr', null,
      h('td', null, shortDate(s.date)), h('td', { title: full(s.newTokens) }, compact(s.newTokens)), h('td', { title: full(s.rereadTokens) }, compact(s.rereadTokens)), h('td', null, full(s.requests)),
      assign ? h('td', null, h('select', { id: `assign-${s.sessionId}`, 'aria-label': `Assign the ${shortDate(s.date)} session to a product`, onchange: (e) => {
        if (e.target.value) send({ action: 'assign', sessionId: s.sessionId, id: e.target.value });
      } }, h('option', { value: '' }, 'Assign to'), data.products.map((o) => h('option', { value: o.id }, o.name)))) : null))))));
}
function detail(p) {
  return h('div', { class: 'detail' },
    h('div', { class: 'title' }, h('h2', null, p.name), actions(p)),
    h('div', { class: 'meters' }, meter('Days', String(p.days)), meter('Estimated hours', hours(p.hours)), meter('Agents', full(p.agents)), meter('Subagents', full(p.subagents))),
    h('div', { class: 'tokens' },
      h('div', { class: 'token new' }, h('span', { class: 'label' }, 'New tokens'), h('span', { class: 'value', title: full(p.newTokens) }, compact(p.newTokens))),
      h('div', { class: 'token reread' }, h('span', { class: 'label' }, 'Re-read tokens'), h('span', { class: 'value', title: full(p.rereadTokens) }, compact(p.rereadTokens)))),
    h('div', { class: 'per' }, h('span', { class: 'label' }, 'Re-read tokens per request'), h('span', { class: 'value', title: full(p.rereadPerRequest) }, compact(p.rereadPerRequest))),
    dayChart(p), modelTable(p), sessionTable(p));
}
function hiddenRow() {
  if (!data.hidden.length) return null;
  return h('div', { class: 'hidden-list' }, 'Hidden:', data.hidden.map((p) => h('button', { onclick: () => send({ action: 'unhide', id: p.id }) }, `Show ${p.name}`)));
}
function draw() {
  const top = h('header', null, h('h1', null, 'Product Stats'), statusLine());
  if (!data) { appEl.replaceChildren(top); return; }
  const items = allItems();
  if (!items.length) {
    appEl.replaceChildren(top, h('section', { class: 'panel empty' }, data.syncing ? 'Reading your Claude Code logs. The first read can take a few minutes.' : 'No Claude Code sessions found yet.'), hiddenRow() ?? '');
    return;
  }
  if (!items.some((p) => p.id === selected)) selected = data.current?.id ?? items[0].id;
  const product = items.find((p) => p.id === selected);
  appEl.replaceChildren(top, nowPanel(), h('div', { class: 'main' }, listPanel(), detail(product)), hiddenRow() ?? '');
}
function isEditing() {
  return renaming || document.activeElement?.tagName === 'SELECT';
}
async function load() {
  try {
    const res = await fetch('/api/data');
    if (!res.ok) throw new Error('bad status');
    data = await res.json();
    failed = false;
  } catch {
    failed = true;
  }
  if (isEditing()) return;
  const { generatedAt, ...stable } = data ?? {};
  const json = JSON.stringify(stable) + failed;
  if (json !== lastJson) { lastJson = json; draw(); }
  else {
    const status = appEl.querySelector('.status');
    if (status) status.replaceWith(statusLine());
  }
}
draw();
load();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
