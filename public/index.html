<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ship Tally</title>
<style>
:root{--sans:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,monospace}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:15px/1.45 var(--sans);background:var(--bg);background-image:radial-gradient(1100px 620px at 50% 46%,var(--glow),transparent 72%);min-height:100vh}
main{max-width:1200px;margin:0 auto;padding:24px 20px 56px;display:grid;gap:18px}
.top{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.rt{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.top h1{font-size:26px;text-align:center}
h1{margin:0;font-size:22px;letter-spacing:-.02em}
.seg{display:inline-flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:11px;background:var(--card)}
.seg button{all:unset;cursor:pointer;padding:6px 18px;border-radius:8px;color:var(--mut);font-size:14px}
.seg button.on{background:var(--acc);color:var(--ink)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills button{all:unset;cursor:pointer;font-size:13px;padding:5px 13px;border:1px solid var(--line);border-radius:999px;color:var(--mut)}
.pills button.on{color:var(--ink);border-color:var(--ok);background:var(--acc)}
button:focus-visible,.lab:focus-visible,.st:focus-visible{outline:2px solid var(--acc)!important}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--card);border:1px solid var(--line);border-radius:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
h2{font-size:15px;margin:0 0 10px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}
th{color:var(--mut);font-weight:500;font-size:13px;text-align:right;padding:0 0 8px 14px}
td{padding:9px 0 9px 14px;border-top:1px solid var(--line);text-align:right;font:14px var(--mono)}
th.l,td.l{text-align:left}
th:first-child,td:first-child{padding-left:0}
td.n{font-family:var(--sans)}
.ringmap{position:relative;display:grid;grid-template-columns:262px minmax(0,1fr) 262px;height:790px}
.lab.go{cursor:pointer;transition:transform .15s,background .15s}
.lab.go:hover{transform:translateX(-4px);background:var(--hover)}
.ringmap canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#mapin{display:contents}
.col{display:flex;flex-direction:column;justify-content:space-between;position:relative;z-index:1;gap:8px}
.col h3{margin:0;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:600}
.lab{background:var(--lab);border:1px solid var(--c);border-radius:10px;padding:8px 11px}
.lab .t{display:flex;gap:7px;align-items:center;font-weight:600;font-size:14px}
.lab .n{font:600 16px var(--mono);color:var(--c)}
.lab p{margin:1px 0 0;color:var(--soft);font-size:12.5px;line-height:1.3}
.mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;z-index:1;width:210px;padding:10px 14px;border-radius:50%/40%;background:radial-gradient(closest-side,var(--card) 70%,transparent);pointer-events:none}
.mid b{display:block;font-size:15px}
.mid em{display:block;font:600 19px var(--mono);font-style:normal;color:var(--hi)}
.mid span{display:block;font-size:12px;color:var(--soft);line-height:1.3}
.lls{display:flex;flex-wrap:wrap;gap:4px 14px;margin:4px 0 8px;font-size:13px}
.ll i{display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--c);margin-right:5px}
.ll b{font:600 13px var(--mono)}
.hd{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;gap:6px;align-items:center;font:600 12px var(--mono);color:var(--acc);border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);border-radius:6px;padding:2px 8px}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.clock{font:600 14px var(--mono);color:var(--hi)}
.two{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px}
h2 em{display:block;font:400 12px var(--sans);color:var(--mut);margin-top:1px}
.trh,.tr{display:grid;grid-template-columns:100px 50px minmax(0,1fr) minmax(0,1fr) 46px 62px;gap:8px;font:12px var(--mono);padding:5px 4px;align-items:center}
.trh{color:var(--mut);border-bottom:1px solid var(--line)}
.tr span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr span:nth-child(n+5),.trh span:nth-child(n+5){text-align:right}
.tr{cursor:pointer;border-bottom:1px solid var(--line)}
.tr:hover{background:var(--hover)}
.tapebox{height:280px;overflow:hidden;position:relative}
.tapein{animation:roll var(--dur,60s) linear infinite}
.tapebox:hover .tapein{animation-play-state:paused}
@keyframes roll{to{transform:translateY(-50%)}}
#trend{width:100%;height:306px;display:block;cursor:crosshair}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.tile{border:1px solid color-mix(in srgb,var(--acc) 33%,transparent);background:color-mix(in srgb,var(--acc) 5%,transparent);border-radius:8px;padding:9px 13px}
.tile .a{font-size:12px;color:var(--mut)}
.tile .b{font:600 17px var(--mono);color:var(--hi)}
.tile .c{font-size:12px;color:var(--soft)}
.spark{display:block;width:100%;height:20px;margin-top:3px}
.spark polyline{fill:none;stroke:var(--c);stroke-width:1.5;vector-effect:non-scaling-stroke;stroke-dasharray:600;animation:drawl 5s linear infinite}
@keyframes drawl{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}
@media(max-width:900px){.two{grid-template-columns:minmax(0,1fr)}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.trh,.tr{grid-template-columns:92px 48px minmax(0,1fr) 56px;gap:6px}.trh span:nth-child(4),.tr span:nth-child(4),.trh span:nth-child(5),.tr span:nth-child(5){display:none}}
.mleg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mut);margin-bottom:10px}
.st{padding:12px 16px;border-left:1px solid var(--line);min-width:0}
.st:first-child{border-left:0}
.st{position:relative}
.sl{grid-column:1/-1;color:var(--mut);font-size:13px}
.sv{font:600 28px/1.2 var(--mono);letter-spacing:-.03em}
.st .lls{margin:3px 0 0;gap:1px 10px;color:var(--mut);font-size:12px}
.st .ll b{font-size:12px}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.st{border-left:0;border-top:1px solid var(--line)}.st:first-child{border-top:0}}
.lab[data-act]{cursor:pointer;transition:transform .15s,background .15s}
.lab[data-act]:hover{transform:translateX(4px);background:var(--hover)}
.lab.sel{box-shadow:0 0 0 2px var(--c)}
#detail h2{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
#detail button{all:unset;cursor:pointer;color:var(--mut);font-size:13px;padding:2px 8px;border:1px solid var(--line);border-radius:6px}
#detail p{margin:0 0 10px;color:var(--soft);font-size:13.5px}
.drow{display:grid;grid-template-columns:190px minmax(0,1fr) 130px;gap:12px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:13.5px}
.drow i{display:block;height:9px;border-radius:5px;min-width:2px}
.drow b{font:600 13.5px var(--mono);text-align:right}
.card{background:var(--card);border-color:var(--line)}
.top h1{font-size:30px;font-weight:500;letter-spacing:-.035em}
.pills button.on{color:var(--on);font-weight:600}
.seg button.on{color:var(--on);font-weight:600}
.lab{background:var(--lab);border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.sv,.mid em,.lab .n,.tile .b{font-family:var(--sans);font-weight:500;letter-spacing:-.02em}
.sv{font-size:34px}
.mid{background:radial-gradient(closest-side,var(--mid) 70%,transparent)}
.col h3,.st .sl{letter-spacing:.02em}
h2{font-weight:500}


.tb{all:unset;cursor:pointer;display:grid;place-items:center;width:40px;height:38px;font-size:18px;border:1px solid var(--line);border-radius:11px;background:var(--card)}
.tb:hover{background:var(--hover)}
.tb:focus-visible{outline:2px solid var(--acc)}
.pill{color:var(--mut);border-color:var(--line)}
.pill i{background:var(--mut);animation:none}
.pill.on{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 40%,transparent)}
.pill.on i{background:var(--acc);animation:blink 1s steps(2) infinite}
.now{margin-left:auto;font-size:11px;font-weight:600;color:var(--acc);white-space:nowrap}
.lab .t{min-width:0;overflow-wrap:anywhere}
.mleg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mut);margin-bottom:12px}
.mleg i,.vparts i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.tm2{position:relative;width:100%;border-radius:10px;overflow:hidden}
.tmg{position:absolute;padding:0 2px}
.tmt{height:26px;line-height:26px;padding:0 6px;font-size:13px;font-weight:600;color:var(--c);white-space:nowrap;overflow:hidden}
.tmt b{font:600 13px var(--mono);color:var(--ink)}
.tmt span{color:var(--mut);font-weight:400}
.tmb{position:absolute;left:2px;right:2px;top:26px;bottom:0}
.tmm{all:unset;position:absolute;box-sizing:border-box;cursor:pointer;padding:0;border:1px solid var(--card);border-radius:6px;overflow:hidden;background:var(--hover);transition:filter .15s}
.tmm:hover{filter:brightness(1.12)}
.tmm.sel{outline:2px solid var(--ink);outline-offset:-2px;z-index:1}
.tmm:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
.tmh{position:absolute;left:0;right:0;top:0;height:21px;padding:2px 7px;font:12px var(--mono);color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmh b{font-weight:600;color:var(--ink)}
.tmi{position:absolute;left:0;right:0;bottom:0}
.tmc{position:absolute;box-sizing:border-box;border:1px solid var(--card);padding:4px 6px;color:var(--on);font-size:12px;line-height:1.2;overflow:hidden}
.tmc b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmc u{text-decoration:none;font:600 11.5px var(--mono)}
.vdet{margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;color:var(--soft)}
.vdet>b{color:var(--ink);font:600 13.5px var(--mono)}
.vparts{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:6px}
.vparts b{font:600 13px var(--mono);color:var(--ink)}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.acts button,.acts select,.acts input,#manage select,#changes button{font:inherit;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:7px;padding:6px 10px;max-width:100%}
.acts button:hover,#changes button:hover{background:var(--hover);cursor:pointer}
#changes{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--mut);font-size:13px}
#changes:empty,#notes:empty{display:none}
#notes p{margin:0 0 6px;padding:9px 13px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;color:var(--soft)}
#empty{padding:40px 18px;text-align:center;color:var(--mut)}
#body{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;min-width:0}
main{grid-template-columns:minmax(0,1fr)}
#body[hidden],#empty[hidden],#detail[hidden],#manage[hidden]{display:none}
@media(prefers-reduced-motion:reduce){.tapein,.pill.on i,.spark polyline{animation:none}}
@media(max-width:1000px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:820px){.top{grid-template-columns:minmax(0,1fr)}.top h1{order:-1}.rt{justify-content:flex-start}.hd{justify-content:center}.ringmap{grid-template-columns:minmax(0,1fr);height:auto;gap:12px}.ringmap canvas{display:none}.mid{position:static;transform:none;width:auto}.col h3{margin-top:6px}.drow{grid-template-columns:minmax(0,1fr) 110px}.drow span:nth-child(2){display:none}}
</style>
</head>
<body>
<main>
  <div class="top"><div class="hd"><span class="pill" id="pill"><i></i><span>READING LOGS</span></span><span class="clock" id="clock"></span></div><h1>Ship Tally</h1><div class="rt"><div class="seg" id="seg"><button data-k="all" class="on">All</button><button data-k="claude">Claude</button><button data-k="codex">Codex</button></div><button class="tb" id="theme"></button></div></div>
  <section class="card" id="empty" hidden></section>
  <div id="body" hidden>
    <div id="notes"></div>
    <div class="pills" id="pills"></div>
    <section class="cards" id="cards"></section>
    <section class="card"><div class="ringmap" id="map"><canvas id="ring" aria-hidden="true"></canvas><div id="mapin"></div></div></section>
    <section class="card" id="detail" hidden></section>
    <section class="card" id="manage" hidden></section>
    <section class="two">
      <div class="card"><h2>▪ ACTIVITY TAPE <em>Latest work sessions, newest first. Click a row to open its product.</em></h2>
        <div class="trh"><span>When</span><span>LLM</span><span>Product</span><span>Model</span><span>Steps</span><span>New tokens</span></div>
        <div class="tapebox"><div class="tapein" id="tape"></div></div></div>
      <div class="card"><h2>▪ TOKENS OVER TIME <em>New tokens each day. Move your mouse over it to read a day.</em></h2><canvas id="trend"></canvas></div>
    </section>
    <section class="tiles" id="tiles"></section>
    <section class="card"><h2>LLM <span id="llmfor" style="color:var(--mut);font-weight:400"></span></h2><div id="models"></div></section>
    <div id="changes"></div>
  </div>
</main>
<script>
const REFRESH_MS = 5000;
const UNSORTED = '__unsorted__';
const OTHER = '__other__';
const THEMES = {"sky":{"bg":"#f2f6fb","card":"#ffffff","lab":"#fffffff0","line":"#d9e2ee","ink":"#14202e","mut":"#66768a","soft":"#44556a","acc":"#2563eb","on":"#ffffff","hover":"#e8eff8","hi":"#1d4ed8","glow":"#2563eb14","mid":"#f2f6fb","claude":"#2563eb","codex":"#0f9d8a","pal":["#2563eb","#0f9d8a","#7a5bd0","#e8741a","#d23f73","#4f8a3a","#66768a"],"d":["#2563eb","#5b8def","#1d4ed8"],"dn":"#b4c2d4","g":["#2563eb1c","#2563eb0c","#2563eb00"],"wire":"#000000","op":"source-over","you":"#1d4ed8","mem":"#7a5bd0","out":"#1d4ed8","file":"#1d4ed8"},"violet":{"bg":"#0a0614","card":"#130c22","lab":"#130c22e6","line":"#2b2140","ink":"#f1ecfa","mut":"#9a90b0","soft":"#c6bcd9","acc":"#9b6bff","on":"#0a0614","hover":"#1e1533","hi":"#c9aeff","glow":"#6b3bff24","mid":"#0d0819","claude":"#b68bff","codex":"#5ee0d6","pal":["#9b6bff","#5ee0d6","#ff7ac6","#ffc46b","#6fb7ff","#b7d968","#b9b2c8"],"d":["#e3d4ff","#b68bff","#7a4dff"],"dn":"#4a3d6b","g":["#7a4dff30","#7a4dff14","#7a4dff00"],"wire":"#ffffff","op":"lighter","you":"#e3d4ff","mem":"#ff7ac6","out":"#b68bff","file":"#c9aeff"}};
let TH = THEMES.sky;
const COL = {};
const NAME = { claude: 'Claude', codex: 'Codex' };
const EMPTY = { id: '', name: '', newTokens: 0, rereadTokens: 0, requests: 0, agents: 0, subagents: 0, days: 0, hours: 0, files: 0, path: {}, pathMissing: 0, perDay: [], perModel: [], topSessions: [], lastAt: 0 };
const $ = (id) => document.getElementById(id);

let data = null, failed = false, k = 'all', pick = null, act = null, renaming = false, openModel = null, lastJson = '';
let colors = new Map(), dates = [], trendS = [], trendHover = -1;

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => (n >= 1e9 ? `${(n / 1e9).toFixed(2)}B` : n >= 1e6 ? `${(n / 1e6).toFixed(1)}M` : n >= 1e3 ? `${(n / 1e3).toFixed(1)}K` : String(Math.round(n)));
const num = (n) => Math.round(n).toLocaleString('en-US');
const plural = (n, word) => `${num(n)} ${word}${Math.round(n) === 1 ? '' : 's'}`;
const shortDate = (d) => new Date(`${d}T12:00:00`).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const keys = () => (k === 'all' ? ['claude', 'codex'] : [k]);
const viewOf = (x) => (x === 'all' ? data : data.views[x]);
const listOf = (v) => [...v.products, ...(v.unsorted ? [v.unsorted] : [])];
const statOf = (x) => (pick ? listOf(viewOf(x)).find((p) => p.id === pick) ?? EMPTY : viewOf(x).totals);
const setHTML = (el, html) => { if (el.dataset.h !== html) { el.innerHTML = html; el.dataset.h = html; return true; } return false; };

function allDates() {
  const days = data.totals.perDay;
  if (!days.length) return [];
  const list = [];
  const end = new Date(`${days.at(-1).date}T12:00:00`);
  const pad = (n) => String(n).padStart(2, '0');
  for (let d = new Date(`${days[0].date}T12:00:00`); d <= end; d.setDate(d.getDate() + 1)) list.push(`${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`);
  return list;
}
function series(stat, field) {
  const byDate = new Map(stat.perDay.map((d) => [d.date, d[field]]));
  return dates.map((d) => byDate.get(d) ?? 0);
}
function spark(values) {
  if (values.length < 2) return '';
  const top = Math.max(...values, 1);
  const pts = values.map((v, i) => `${(i / (values.length - 1) * 100).toFixed(1)},${(18 - v / top * 16).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 100 20" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}"/></svg>`;
}

/* The product boxes on All products. Small products share one box. */
function productBoxes() {
  const v = viewOf(k);
  const sorted = listOf(v).filter((p) => p.newTokens > 0).sort((a, b) => b.newTokens - a.newTokens);
  const main = sorted.slice(0, 6);
  const rest = sorted.slice(6);
  const unsorted = rest.find((p) => p.id === UNSORTED);
  if (unsorted) { rest.splice(rest.indexOf(unsorted), 1, main.pop()); main.push(unsorted); }
  const list = [...main];
  if (rest.length) {
    const sum = (f) => rest.reduce((a, p) => a + p[f], 0);
    list.push({ id: OTHER, name: `${rest.length} smaller ${rest.length === 1 ? 'product' : 'products'}`, newTokens: sum('newTokens'), agents: sum('agents'), subagents: sum('subagents'), perDay: [] });
  }
  return { list, rest };
}

function lab(c, emoji, name, value, text, line, act2) {
  return `<div class="lab" ${act2 ? `data-act="${act2}" tabindex="0" role="button"` : ''} data-c="${c}" style="--c:${c}"><div class="t"><span>${emoji}</span>${esc(name)}</div><div class="n">${esc(value)}</div><p>${esc(text)}</p>${line ? spark(line) : ''}</div>`;
}
function leftBoxes(s) {
  const path = s.path;
  const out = [lab(TH.you, '🧑', 'You', plural(path.messages ?? 0, 'message'), `What you typed to give instructions. You stopped agents ${plural(path.stops ?? 0, 'time')}.`, null, 'you')];
  for (const x of keys()) {
    const v = statOf(x);
    out.push(lab(COL[x], '🤖', `${NAME[x]} agents`, `${num(v.agents)} main + ${plural(v.subagents, 'subagent')}`, `A main agent is one ${NAME[x]} chat session. It can start subagents, which are helpers. Line shows tokens each day.`, series(v, 'newTokens'), x));
  }
  out.push(lab(TH.mem, '🧠', 'Memory', `${fmt(s.rereadTokens)} tokens`, 'Earlier chat and files the LLM reads again on each step.', series(s, 'rereadTokens'), 'memory'));
  return out.join('');
}
function rightBoxes(s) {
  if (pick) {
    const p = s.path;
    return [
      lab(TH.out, '👁️', 'Reading', plural(p.reads ?? 0, 'read'), 'Agents opened files and searched to understand the work.'),
      lab(TH.out, '💻', 'Commands', plural(p.commands ?? 0, 'command'), 'Agents ran programs and checks on your computer.'),
      lab(TH.out, '🌐', 'Internet', plural(p.web ?? 0, 'use'), 'Agents looked things up online or used a browser.'),
      lab(TH.out, '👥', 'Delegated', plural(p.delegated ?? 0, 'task'), 'Main agents gave smaller jobs to subagents.'),
      lab(TH.file, '📦', 'Files', plural(s.files, 'file'), 'Files that agents created or edited.'),
    ].join('');
  }
  const { list } = productBoxes();
  const total = list.reduce((a, p) => a + p.newTokens, 0) || 1;
  const weights = list.map((p) => Math.max(p.newTokens / total, 0.07));
  const weightSum = weights.reduce((a, b) => a + b, 0);
  let from = -Math.PI / 2;
  colors = new Map();
  segs = [];
  return list.map((p, n) => {
    const c = TH.pal[n % TH.pal.length];
    const span = weights[n] / weightSum * Math.PI;
    segs.push({ from, to: from + span, c });
    from += span;
    colors.set(p.id, c);

      if (Math.abs(aa) < Math.PI / 2) for (let i = 0; i < segs.length; i += 1) if (aa >= segs[i].from && aa < segs[i].to) { col = segs[i].c; al = (0.35 + 0.65 * depth) * (hover < 0 || hover === i ? 1 : 0.15); break; }
    }
    ctx.globalAlpha = al; ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(cx + X * p, cy + y2 * p, 0.7 + 1.1 * depth, 0, 6.3); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}
function drawTrend(now) {
  const c = $('trend');
  if (!c || !trendS.length || !dates.length) return;
  const dpr = devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
  if (c.width !== w * dpr) { c.width = w * dpr; c.height = h * dpr; }
  const g = c.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
  const pad = [24, 8, 22, 48], n = dates.length, top = Math.max(...trendS.flatMap((s) => s.v), 1);
  const X = (i) => pad[3] + i / Math.max(n - 1, 1) * (w - pad[3] - pad[1]);
  const Y = (v) => h - pad[2] - v / top * (h - pad[0] - pad[2]);
  g.font = '11px ui-monospace,Menlo,monospace'; g.fillStyle = TH.mut; g.strokeStyle = TH.line; g.lineWidth = 1; g.textAlign = 'right'; g.textBaseline = 'alphabetic';
  for (let i = 0; i <= 3; i += 1) { const v = top * i / 3, y = Y(v); g.beginPath(); g.moveTo(pad[3], y); g.lineTo(w - pad[1], y); g.stroke(); g.fillText(fmt(v), pad[3] - 5, y + 4); }
  g.textAlign = 'left'; g.fillText(shortDate(dates[0]), pad[3], h - 5); g.textAlign = 'right'; g.fillText(shortDate(dates[n - 1]), w - pad[1], h - 5);
  const i = trendHover >= 0 ? trendHover : (still ? n - 1 : Math.floor(now / 900) % n);
  for (const s of trendS) {
    g.beginPath(); s.v.forEach((v, j) => { if (j) g.lineTo(X(j), Y(v)); else g.moveTo(X(j), Y(v)); });
    g.strokeStyle = COL[s.x]; g.lineWidth = 1.8; g.stroke();
    g.beginPath(); g.arc(X(i), Y(s.v[i]), 4, 0, 6.3); g.fillStyle = COL[s.x]; g.shadowColor = COL[s.x]; g.shadowBlur = 10; g.fill(); g.shadowBlur = 0;
  }
  g.strokeStyle = TH.soft; g.beginPath(); g.moveTo(X(i), pad[0]); g.lineTo(X(i), h - pad[2]); g.stroke();
  const txt = `${shortDate(dates[i])}  ${trendS.map((s) => `${NAME[s.x]} ${fmt(s.v[i])}`).join('  ')}`;
  const tw = g.measureText(txt).width + 14, tx = Math.min(Math.max(X(i) - tw / 2, pad[3]), w - tw - 2);
  g.fillStyle = TH.card; g.strokeStyle = TH.acc; g.fillRect(tx, 1, tw, 18); g.strokeRect(tx, 1, tw, 18);
  g.fillStyle = TH.ink; g.textAlign = 'left'; g.fillText(txt, tx + 7, 14);
}
function loop(n) { draw(n); drawTrend(n); if (!still) requestAnimationFrame(loop); }

/* Events */
function setK(n) { k = n; for (const b of $('seg').children) b.classList.toggle('on', b.dataset.k === k); }
function openProduct(id) { pick = id || null; openModel = null; renaming = false; render(); }
function pressBox(el) {
  const a = el.closest('.lab[data-act]');
  if (a) {
    const n = a.dataset.act;
    if (n === 'claude' || n === 'codex') { setK(k === n ? 'all' : n); openModel = null; render(); }
    else { act = act === n ? null : n; render(); if (act) $('detail').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
    return;
  }
  const p = el.closest('.lab.go');
  if (p) openProduct(p.dataset.id);
}
$('seg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { setK(b.dataset.k); openModel = null; render(); } });
$('pills').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) openProduct(b.dataset.id); });
const mapEl = $('map');
mapEl.addEventListener('click', (e) => pressBox(e.target));
mapEl.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('.lab[role=button]')) { e.preventDefault(); pressBox(e.target); } });
mapEl.addEventListener('mouseover', (e) => { const l = e.target.closest('.lab[data-seg]'); hover = l ? +l.dataset.seg : -1; if (still) draw(0); });
mapEl.addEventListener('mouseleave', () => { hover = -1; if (still) draw(0); });
$('detail').addEventListener('click', (e) => { if (e.target.closest('[data-x]')) { act = null; render(); } });
$('tape').addEventListener('click', (e) => { const r = e.target.closest('.tr[data-id]'); if (r && listOf(data).some((p) => p.id === r.dataset.id)) { openProduct(r.dataset.id); scrollTo({ top: 0, behavior: still ? 'auto' : 'smooth' }); } });
$('models').addEventListener('click', (e) => { const b = e.target.closest('.tmm'); if (b) { openModel = openModel === b.dataset.m ? null : b.dataset.m; llmGraph(); } });
const trendEl = $('trend');
trendEl.addEventListener('mousemove', (e) => { const r = trendEl.getBoundingClientRect(); trendHover = Math.max(0, Math.min(dates.length - 1, Math.round((e.clientX - r.left - 48) / (r.width - 56) * (dates.length - 1)))); if (still) drawTrend(0); });
trendEl.addEventListener('mouseleave', () => { trendHover = -1; });
$('manage').addEventListener('click', (e) => {
  const d = e.target.closest('[data-do]')?.dataset.do;
  if (d === 'rename') { renaming = true; render(); }
  else if (d === 'cancel') { renaming = false; render(); }
  else if (d === 'hide') { const id = pick; pick = null; send({ action: 'hide', id }); }
});
$('manage').addEventListener('submit', (e) => { e.preventDefault(); const name = $('rename-input').value.trim(); if (name) send({ action: 'rename', id: pick, name }); });
$('manage').addEventListener('change', (e) => {
  if (e.target.id === 'join' && e.target.value) send({ action: 'merge', from: e.target.value, to: pick });
  else if (e.target.dataset.assign && e.target.value) send({ action: 'assign', sessionId: e.target.dataset.assign, id: e.target.value });
});
$('changes').addEventListener('click', (e) => { const b = e.target.closest('[data-undo]'); if (b) send(JSON.parse(b.dataset.undo)); });

/* Theme */
const NEXT = { sky: 'violet', violet: 'sky' };
const themeBtn = $('theme');
function setTheme(name) {
  const n = THEMES[name] ? name : 'sky';
  TH = THEMES[n];
  const r = document.documentElement.style;
  for (const v of ['bg', 'card', 'lab', 'line', 'ink', 'mut', 'soft', 'acc', 'on', 'hover', 'hi', 'glow', 'mid', 'codex', 'claude']) r.setProperty(`--${v}`, TH[v]);
  r.setProperty('--ok', TH.acc);
  COL.claude = TH.claude; COL.codex = TH.codex;
  themeBtn.textContent = n === 'sky' ? '☀️' : '🌙';
  themeBtn.dataset.t = n;
  themeBtn.setAttribute('aria-label', n === 'sky' ? 'Light mode. Switch to dark.' : 'Dark mode. Switch to light.');
  try { localStorage.setItem('st-theme', n); } catch { /* The choice lasts for this visit only. */ }
}
themeBtn.addEventListener('click', () => { setTheme(NEXT[themeBtn.dataset.t]); for (const el of document.querySelectorAll('[data-h]')) delete el.dataset.h; render(); });
addEventListener('resize', () => { layout(); if (data?.sessionCount) llmGraph(); });

/* Live refresh */
const SELECT_HOLD_MS = 20000;
let selectFocusedAt = 0;
document.addEventListener('focusin', (e) => { if (e.target.tagName === 'SELECT') selectFocusedAt = Date.now(); });
const isEditing = () => renaming || (document.activeElement?.tagName === 'SELECT' && Date.now() - selectFocusedAt < SELECT_HOLD_MS);
async function load() {
  try {
    const res = await fetch('/api/data');
    if (!res.ok) throw new Error('bad status');
    data = await res.json();
    failed = false;
  } catch {
    failed = true;
  }
  if (isEditing()) { status(); return; }
  const { generatedAt, ...stable } = data ?? {};
  const json = JSON.stringify(stable) + failed;
  if (json !== lastJson) { lastJson = json; render(); } else status();
}
const tick = () => { $('clock').textContent = new Date().toLocaleTimeString('en-GB'); };
tick();
setInterval(tick, 1000);
let saved = 'sky';
try { saved = localStorage.getItem('st-theme') || 'sky'; } catch { /* Use the default theme. */ }
setTheme(saved);
render();
load();
setInterval(load, REFRESH_MS);
requestAnimationFrame(loop);
</script>
</body>
